[project]
name = "minecraft-wiki-mdifier"
version = "0.1.1"
description = "将Minecraft Wiki页面转换为AI助手易读的Markdown格式"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "stone-brick"}
]
keywords = ["minecraft", "wiki", "markdown", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "markdownify>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
    "pre-commit>=3.5.0",
    "tqdm>=4.66.0",
]

[project.scripts]
mdifier = "minecraft_wiki_mdifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_wiki_mdifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # 行长度（由 line-length 控制）
    "B008",  # 函数调用中的默认参数（FastAPI/click 模式常用）
]

[tool.ruff.lint.per-file-ignores]
# 脚本文件允许 sys.path hack 后的 import
"convert.py" = ["E402"]
"search.py" = ["E402"]
