name: Release

on:
  push:
    tags:
      - 'v*'

# 默认最小权限，安全最佳实践
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. 质量门禁
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest tests/ -v

  # 2. 构建
  build:
    name: Build distribution
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate version matches tag
        run: |
          PACKAGE_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "//;s/"//')
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Version mismatch — package: $PACKAGE_VERSION, tag: $TAG_VERSION"
            exit 1
          fi
          echo "Version validated: $PACKAGE_VERSION"

      - name: Install build
        run: python -m pip install build --user

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Verify distribution
        run: |
          ls -la dist/
          pip install dist/*.whl

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  # 3. 发布到 PyPI + 创建 GitHub Release
  publish:
    name: Publish to PyPI & Create Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        id: testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: success()
        run: rm -f dist/*.publish.attestation
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Generate Release Notes
        id: release-notes
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md found" > release_notes.md
          else
            CONTENT=$(awk -v ver="$TAG_VERSION" '
              /^\[/{f=0}
              f{body=body $0 "\n"}
              /^\['"ver"'\]/{f=1; next}
              END{print body}
            ' CHANGELOG.md)
            if [ -z "$CONTENT" ]; then
              echo "No release notes found for v$TAG_VERSION" > release_notes.md
            else
              echo "$CONTENT" > release_notes.md
            fi
          fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
